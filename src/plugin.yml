name: MegaWalls
main: net.nuggetmc.mw.MegaWalls
version: 1.0
api-version: 1.16
authors: [ HorseNuggets,keaidehuangpi ]
depend: [ NametagAPI,Citizens,MixBukkit ]
softdepend: [ Essentials,RegionPreserve,ScoreboardPlus,SkinsRestorer ]
commands:
  megawalls:
    description: The MegaWalls base command.
    usage: /mw
    aliases: [ mw, class, kit ]
  energy:
    description: Instant max energy (for debug).
    usage: /energy
    permission: mw.energy
  luckdraw:
    description: luck draw.
    usage: /luckdraw
    permission: mw.luckdraw
  coinsmgr:
    description: coinsmgr command.
    usage: /coinsmgr
    permission: mw.admin
  kitlock:
    description: kitlock
    usage: /kitlock
    permission: mw.admin
  seeinv:
    description: see a player's inventory.
    usage: /seeinv
    permission: mw.seeinv
  mwspawn:
    description: set spawn.
    usage: /mwspawn
    permission: mw.admin
  echest:
    description: see the echest of a player.
    usage: /echest
  mwshop:
    description: open the shop menu.
    usage: /mwshop
  mwsell:
    description: open the sell menu.
    usage: /mwsell
  mwcoins:
    description: see the coins amount of a player.
    usage: /mwcoins
  mwbaltop:
    description: see the balance top.
    usage: /mwbaltop
  killeffects:
      description: opens the kill effects menu.
      usage: /killeffects
  mwride:
    description: ride a player.
    usage: /mwride
    permission: mw.ride
  mwmakeride:
    description: make a player ride you.
    usage: /mwmakeride
    permission: mw.makeride
  mwitem:
    description: give player a megawalls item.
    usage: /mwitem
    permission: mw.admin
  walkspeed:
    description: set a player's walk speed.
    usage: /walkspeed
    permission: mw.admin
  pay:
    description: pay coins.
    usage: /pay
  mk2:
    description: ride on a mk2.
    usage: /mk2
  mwdebug:
    description: debugger
    usage: /mwdebug
permissions:
  mw.*:
    description: MegaWalls parent permission.
    default: op
    children:
      mw.admin: true
      mw.seeinv: true
      mw.otherscoin: true
      mw.ride: true
      mw.makeride: true
  mw.admin:
    default: op
  mw.seeinv:
    default: op
  mw.otherscoin:
    default: op
  mw.ride:
    default: op
  mw.makeride:
    default: op